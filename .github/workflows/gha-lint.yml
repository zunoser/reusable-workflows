name: GitHub Actions lint

on:
  workflow_call:
    inputs:
      verify-actions-lock:
        description: Fail when .github/workflows/actions.lock is missing, incomplete, or would be rejected by the runner.
        type: boolean
        default: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify actions.lock
        if: inputs.verify-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/gh-actions-lock"
          curl --fail --location --silent --show-error \
            --output "$bin" \
            https://github.com/github/gh-actions-lock/releases/download/v0.5.1/linux-amd64
          printf '%s  %s\n' '94009f287cfcc046ff371824824c203a8a44c981ca2dac344052744897c29c3a' "$bin" |
            sha256sum --check
          chmod +x "$bin"
          "$bin" --verify

      # Workflows onboarded to actions.lock keep tag refs, which pinact v5 would
      # flag. Check only what the lockfile does not pin: reusable workflow calls
      # and action definitions outside .github/actions/. gh actions-lock --verify
      # rejects local actions called as ./, so those under .github/actions/ run
      # as $/ and the lockfile pins their refs as tags. Without a lockfile, every
      # ref needs a SHA pin.
      - name: Check SHA pins with pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOCKED: ${{ inputs.verify-actions-lock }}
        run: |
          archive="$RUNNER_TEMP/pinact_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/suzuki-shunsuke/pinact/releases/download/v5.0.2/pinact_linux_amd64.tar.gz
          printf '%s  %s\n' '7f003d8f51e984c2264d2009d430e3e0e87ae404a0e2dc2a9a277b0f731bf5b7' "$archive" |
            sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" pinact
          pinact="$RUNNER_TEMP/pinact"
          if [ "$LOCKED" != true ]; then
            "$pinact" run --check --verify-comment
            exit 0
          fi
          "$pinact" run --check --verify-comment --include '.*/\.github/workflows/.*'
          mapfile -t actions < <(git ls-files -- 'action.yml' 'action.yaml' '**/action.yml' '**/action.yaml' |
            grep -v '^\.github/actions/' || true)
          if [ "${#actions[@]}" -gt 0 ]; then
            "$pinact" run --check --verify-comment "${actions[@]}"
          fi

      - uses: jdx/jactionlint@v2.6.0
        with:
          profile: correctness

      - name: Run ghalint
        run: |
          archive="$RUNNER_TEMP/ghalint_1.6.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/suzuki-shunsuke/ghalint/releases/download/v1.6.0/ghalint_1.6.0_linux_amd64.tar.gz
          printf '%s  %s\n' 'eda1af79c1a4a31c2de5831cd1333ad582fa6fa72015f8e9c1c4525d550c1d35' "$archive" |
            sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" ghalint
          "$RUNNER_TEMP/ghalint" run

      - uses: zizmorcore/zizmor-action@v0.9.2
        with:
          version: v1.32.0
          advanced-security: false
          annotations: true
